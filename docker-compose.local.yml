services:
  mysql:
    image: mysql:8.4
    container_name: archive-master-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aguas_de_sucre
      MYSQL_USER: archivemaster
      MYSQL_PASSWORD: archivemaster_local
      MYSQL_ROOT_PASSWORD: root_local
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - archive-master-local-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_local --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: archive-master-local-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "archivemaster_local"]
    ports:
      - "6380:6379"
    volumes:
      - archive-master-local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "archivemaster_local", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: archive-master-local-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: archivemaster_local_meili
    ports:
      - "7700:7700"
    volumes:
      - archive-master-local-meilisearch:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    container_name: archive-master-local-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  archive-master-local-mysql:
  archive-master-local-redis:
  archive-master-local-meilisearch:

