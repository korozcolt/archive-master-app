[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PHP_VERSION = "8.4"
NODE_ENV = "production"
COMPOSER_ALLOW_SUPERUSER = "1"
PHP_UPLOAD_MAX_FILESIZE = "1024M"
PHP_POST_MAX_SIZE = "2048M"
PHP_MAX_FILE_UPLOADS = "200"
NGINX_CLIENT_MAX_BODY_SIZE = "0"

[phases.setup]
aptPkgs = [
  "...",
  "poppler-utils",
  "tesseract-ocr",
  "tesseract-ocr-eng",
  "tesseract-ocr-spa"
]

[phases.install]
cmds = [
  "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
  "composer install --ignore-platform-reqs",
  "npm install --include=dev",
  "PHP_INI_DIR=$(find /nix/store -name 'php.ini' -path '*/lib/php.ini' 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo '/etc') && printf 'upload_max_filesize = 1024M\\npost_max_size = 2048M\\nmemory_limit = 512M\\nmax_file_uploads = 200\\nmax_execution_time = 300\\nmax_input_time = 300\\n' > ${PHP_INI_DIR}/php.ini && echo 'PHP limits written to '${PHP_INI_DIR}'/php.ini'"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "bash /app/scripts/deploy-bootstrap.sh && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && bash /app/scripts/run-runtime-services.sh"
